name: Build 0.9.24.1 Phase Locked Empty Atlas Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Locate Gradle project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$GITHUB_WORKSPACE"

          if [[ ! -f "$PROJECT_DIR/build.gradle" && ! -f "$PROJECT_DIR/build.gradle.kts" ]]; then
            CANDIDATE=$(find "$GITHUB_WORKSPACE" -maxdepth 8 -type f \
              \( -name build.gradle -o -name build.gradle.kts \) \
              -print -quit || true)

            if [[ -z "$CANDIDATE" ]]; then
              ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -name '*.zip' -print -quit || true)

              if [[ -n "$ZIP_FILE" ]]; then
                EXTRACT_DIR="$RUNNER_TEMP/slopeconnector-source"
                rm -rf "$EXTRACT_DIR"
                mkdir -p "$EXTRACT_DIR"
                unzip -q -o "$ZIP_FILE" -d "$EXTRACT_DIR"

                CANDIDATE=$(find "$EXTRACT_DIR" -maxdepth 8 -type f \
                  \( -name build.gradle -o -name build.gradle.kts \) \
                  -print -quit || true)
              fi
            fi

            if [[ -z "$CANDIDATE" ]]; then
              echo 'ERROR: No build.gradle or build.gradle.kts was found.'
              echo 'Upload the extracted source files, or upload one source ZIP.'
              find "$GITHUB_WORKSPACE" -maxdepth 4 -type f | sort
              exit 1
            fi

            PROJECT_DIR=$(dirname "$CANDIDATE")
          fi

          if [[ ! -f "$PROJECT_DIR/tools/run_static_checks.sh" ]]; then
            echo "ERROR: tools/run_static_checks.sh is missing from $PROJECT_DIR"
            exit 1
          fi

          if [[ ! -f "$PROJECT_DIR/libs/slopeconnector-0.9.19.jar" ]]; then
            echo "ERROR: libs/slopeconnector-0.9.19.jar is missing from $PROJECT_DIR"
            exit 1
          fi

          echo "Located project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Static regression checks
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: bash tools/run_static_checks.sh

      - name: Build mod
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: gradle --no-daemon --console=plain clean build

      - name: Show build outputs
        if: always()
        shell: bash
        run: |
          find "${{ steps.locate.outputs.project_dir }}/build" -maxdepth 3 -type f 2>/dev/null | sort || true

      - name: Upload compiled jars
        uses: actions/upload-artifact@v4
        with:
          name: slope-connector-0.9.24.1-phase-locked-empty-atlas-fix
          path: ${{ steps.locate.outputs.project_dir }}/build/libs/*.jar
          if-no-files-found: error
